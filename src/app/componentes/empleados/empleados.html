<div class="container mt-5">
  <div class="row">
    <div class="col-12 mb-4">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">{{ flag ? 'Editar Empleado' : 'Crear Empleado' }}</h4>
        </div>
        <div class="card-body">
          <form (ngSubmit)="grabarEmpleado(modeloEmpleado)">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" [(ngModel)]="modeloEmpleado.nombre" name="nombre" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="paterno" class="form-label">Apellido Paterno</label>
                <input type="text" class="form-control" id="paterno" [(ngModel)]="modeloEmpleado.paterno" name="paterno" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="materno" class="form-label">Apellido Materno</label>
                <input type="text" class="form-control" id="materno" [(ngModel)]="modeloEmpleado.materno" name="materno" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="cargo" class="form-label">Cargo</label>
                <input type="text" class="form-control" id="cargo" [(ngModel)]="modeloEmpleado.cargo" name="cargo" required>
              </div>
            </div>
            <button type="submit" class="btn btn-success">
              {{ flag ? 'Actualizar' : 'Grabar' }}
            </button>
            <button type="button" class="btn btn-secondary ms-2" (click)="cancelar()">Cancelar</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-12 mb-3">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Buscar empleado..." [(ngModel)]="terminoBusqueda" name="terminoBusqueda" (input)="buscarEmpleado()">
      </div>
    </div>
    <div class="col-12">
      <div class="table-responsive shadow-sm">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Nombre</th>
              <th scope="col">Apellido Paterno</th>
              <th scope="col">Apellido Materno</th>
              <th scope="col">Cargo</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let emp of empleadosFiltrados">
                <th scope="row">{{ emp.idempleado }}</th>
                <td>{{ emp.nombre }}</td>
                <td>{{ emp.paterno }}</td>
                <td>{{ emp.materno }}</td>
                <td>{{ emp.cargo }}</td>
                <td>
                  <button class="btn btn-outline-info btn-sm me-2" *ngIf="emp.idempleado !== null"  (click)="obtenerEmpleado(emp.idempleado)">Editar</button>
                  <button class="btn btn-outline-danger btn-sm" *ngIf="emp.idempleado !== null" (click)="eliminarEmpleado(emp.idempleado)">Eliminar</button>
                </td>
              </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
